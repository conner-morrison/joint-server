# Render Blueprint for the relay.
#
# State lives in Postgres, not on disk, so this needs no volume and can be
# restarted freely. Point DATABASE_URL at any Postgres: Render's own, Neon,
# Railway, your own.
services:
  - type: web
    name: relay
    runtime: docker
    plan: starter
    region: frankfurt
    envVars:
      # Set in the dashboard. Until it is set the deployment still starts and
      # its first page says what is missing.
      - key: DATABASE_URL
        sync: false
      # Small on purpose: several instances share one database's connections.
      - key: RELAY_POOL_MAX
        value: "3"
